[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkvessel"
version = "0.1.0"
description = "Sensor-agnostic SAR vessel detection and AIS correlation pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# app/frontend/fixtures: encoder round trips and the lead-code display strings (board D5.1, D6.5)
testpaths = ["tests", "app/frontend/fixtures"]
markers = ["network: test needs internet access (skipped by default)"]
addopts = "-m 'not network'"
