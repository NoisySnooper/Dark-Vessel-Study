# conda env create -f environment.yml && conda activate darkvessel
# All packages from conda-forge. pytorch-cpu is the conda-forge CPU-only build.
name: darkvessel
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gdal>=3.8
  - libgdal-netcdf   # NetCDF driver (RTOFS, MUR, chlorophyll)
  - libgdal-grib     # GRIB driver (GFS, GFS-Wave)
  - rasterio>=1.3
  - geopandas>=0.14
  - pyogrio
  - shapely>=2.0
  - pyproj
  - numpy
  - scipy
  - scikit-image
  - pandas
  - pyarrow
  - matplotlib
  - pystac-client
  - planetary-computer
  - pytorch-cpu
  - torchvision
  - requests
  - fsspec
  - h5py
  - xarray
  - h5netcdf
  - netcdf4
  - scikit-learn
  - aiohttp
  - python-dotenv
  - pyyaml
  - tqdm
  - pytest
  - jupyterlab
  - pip
  # Node 22 (with npm 10) is needed for the app/frontend builds (make app-build). It is not part of
  # this conda env: install it from https://nodejs.org or the system package manager.
  # - nodejs=22
  - pip:
      - mgrs
      - websockets   # aisstream.io live AIS
      - eccodes==2.49.0      # GRIB decoding for darkvessel.ocean.daily (Apache 2.0)
      # Product backend (app/backend, docs/research/stack_decision.md section 3.2)
      - fastapi==0.141.1
      - uvicorn==0.53.0
      - starlette==1.7.0
      - annotated-doc==0.0.5
      - -e .
